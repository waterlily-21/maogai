<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毛概刷题神器</title>
<style>
/* SECTION: base */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#b02a2a;--red-d:#8f1f1f;--red-l:#fdf1ef;
  --ink:#2b2320;--sub:#7a6f68;--line:#eadfd6;
  --bg:#faf6f0;--card:#ffffff;
  --green:#1d8a4e;--green-l:#e8f6ee;
  --wrong:#c0392b;--wrong-l:#fdeceb;
  --gold:#b8860b;--gold-l:#fdf6e3;
}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px}
button{font-family:inherit;font-size:16px;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 90px}
/* SECTION: header */
.topbar{background:linear-gradient(135deg,var(--red-d),var(--red));color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(143,31,31,.25)}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-size:19px;font-weight:700;letter-spacing:1px;flex:1;min-width:0}
.topbar .sub{font-size:12px;opacity:.85;width:100%}
.backbtn{background:rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px;min-height:36px;display:none}
.backbtn.show{display:inline-block}
/* SECTION: views */
.view{display:none;padding-top:16px}
.view.active{display:block}
/* SECTION: home */
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--red)}
.stat span{font-size:12px;color:var(--sub)}
.modegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.modebtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;min-height:64px;transition:transform .1s}
.modebtn:active{transform:scale(.97)}
.modebtn b{display:block;font-size:16px;color:var(--ink)}
.modebtn span{font-size:12px;color:var(--sub)}
.modebtn.hot{background:var(--red);border-color:var(--red)}
.modebtn.hot b,.modebtn.hot span{color:#fff}
.modebtn.hot span{opacity:.85}
.sect-title{font-size:15px;font-weight:700;color:var(--sub);margin:6px 0 10px;letter-spacing:1px}
.chlist{display:flex;flex-direction:column;gap:10px}
.chcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.chcard .chhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.chcard .chname{font-weight:700;font-size:16px;color:var(--red-d)}
.chcard .chtopic{font-size:13px;color:var(--sub);flex:1;min-width:120px}
.chcard .chmeta{font-size:12px;color:var(--sub);margin:4px 0 8px}
.pbar{height:6px;background:var(--red-l);border-radius:3px;overflow:hidden;margin-bottom:10px}
.pbar i{display:block;height:100%;background:var(--red);border-radius:3px;width:0;transition:width .3s}
.chbtns{display:flex;gap:8px;flex-wrap:wrap}
.chbtns button{border:1px solid var(--red);color:var(--red);border-radius:8px;padding:7px 14px;font-size:14px;min-height:38px}
.chbtns button.fill{background:var(--red);color:#fff}
.chbtns button:active{opacity:.8}
.foot-note{margin-top:22px;font-size:12px;color:var(--sub);text-align:center}
.linkbtn{color:var(--sub);text-decoration:underline;font-size:12px;margin-top:8px}
/* SECTION: quiz */
.quizhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.quizhead .qprog{font-size:14px;color:var(--sub);flex:1}
.quizhead .qacc{font-size:13px;color:var(--red);font-weight:600}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.qtype{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;background:var(--gold-l);color:var(--gold);border:1px solid #e8d9a8;margin-bottom:10px}
.qtype.judge{background:#eef3fb;color:#2c5aa0;border-color:#c9d8ef}
.qchap{font-size:12px;color:var(--sub);margin-left:8px}
.qstem{font-size:17px;font-weight:600;margin-bottom:16px;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px;text-align:left;background:#fff;transition:border-color .15s}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red-l);color:var(--red);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt .v{flex:1;min-width:0;word-break:break-word}
.opt.correct{border-color:var(--green);background:var(--green-l)}
.opt.correct .k{background:var(--green);color:#fff}
.opt.wrongpick{border-color:var(--wrong);background:var(--wrong-l)}
.opt.wrongpick .k{background:var(--wrong);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.judgebtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jbtn{border:1.5px solid var(--line);border-radius:12px;padding:18px 10px;font-size:18px;font-weight:700;background:#fff;min-height:64px}
.jbtn.t{color:var(--green)}
.jbtn.f{color:var(--wrong)}
.jbtn.correct{border-color:var(--green);background:var(--green-l)}
.jbtn.wrongpick{border-color:var(--wrong);background:var(--wrong-l)}
.jbtn.dim{opacity:.5}
.feedback{margin-top:14px;border-radius:10px;padding:12px;font-size:15px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--green-l);color:var(--green)}
.feedback.no{background:var(--wrong-l);color:var(--wrong)}
.feedback b{font-size:16px}
.nextrow{margin-top:14px;display:none}
.nextrow.show{display:block}
.nextbtn{width:100%;background:var(--red);color:#fff;border-radius:12px;padding:14px;font-size:17px;font-weight:600;min-height:52px}
.nextbtn:active{background:var(--red-d)}
/* SECTION: result */
.rescard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 18px;text-align:center}
.rescard .big{font-size:44px;font-weight:800;color:var(--red)}
.rescard .lbl{color:var(--sub);font-size:14px;margin-bottom:14px}
.resdetail{font-size:15px;margin-bottom:18px}
.resbtns{display:flex;flex-direction:column;gap:10px}
.resbtns button{border-radius:12px;padding:13px;font-size:16px;min-height:50px}
.resbtns .primary{background:var(--red);color:#fff}
.resbtns .ghost{border:1px solid var(--line);color:var(--sub)}
/* SECTION: wrong */
.wrongbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.wrongbar .start{flex:1;background:var(--red);color:#fff;border-radius:10px;padding:12px;font-size:16px;font-weight:600;min-height:48px}
.wrongbar .clear{border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:12px 14px;font-size:14px}
.witem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.witem .wstem{font-size:15px;font-weight:600;margin:6px 0;word-break:break-word}
.witem .wans{font-size:14px;color:var(--green)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:40px 16px;text-align:center;color:var(--sub);font-size:15px}
/* SECTION: material */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-size:14px;color:var(--sub);min-height:36px}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.mcard .mstem{font-size:15px;white-space:pre-wrap;word-break:break-word;margin:8px 0 12px;max-height:220px;overflow-y:auto;border-left:3px solid var(--line);padding-left:10px}
.mcard .mans{display:none;font-size:15px;white-space:pre-wrap;word-break:break-word;background:var(--green-l);border-radius:10px;padding:12px;margin-bottom:12px}
.mcard .mans.show{display:block}
.mbtns{display:flex;gap:8px;flex-wrap:wrap}
.mbtns button{border-radius:8px;padding:8px 14px;font-size:14px;min-height:40px}
.mbtns .reveal{border:1px solid var(--red);color:var(--red);flex:1}
.mbtns .got{border:1px solid var(--green);color:var(--green)}
.mbtns .got.on{background:var(--green);color:#fff}
.mbtns .notyet{border:1px solid var(--gold);color:var(--gold)}
.mbtns .notyet.on{background:var(--gold);color:#fff}
.mtag{font-size:12px;color:var(--sub)}
.supp{display:inline-block;font-size:12px;background:var(--gold-l);color:var(--gold);border-radius:6px;padding:1px 8px;margin-bottom:6px}
/* SECTION: search */
.searchbox{display:flex;gap:8px;margin-bottom:14px}
.searchbox input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:16px;background:var(--card);color:var(--ink)}
.searchbox input:focus{outline:none;border-color:var(--red)}
.searchbox button{background:var(--red);color:#fff;border-radius:10px;padding:12px 18px;font-size:16px}
.sitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.sitem .sstem{font-size:15px;font-weight:600;margin:6px 0;word-break:break-word}
.sitem .sans{font-size:14px;color:var(--green);white-space:pre-wrap;word-break:break-word}
.scount{font-size:13px;color:var(--sub);margin-bottom:10px}
@media (min-width:640px){
  .modegrid{grid-template-columns:repeat(4,1fr)}
  .qstem{font-size:18px}
}
</style>
</head>
<body>
<!-- SECTION: topbar -->
<div class="topbar"><div class="topbar-in">
<button class="backbtn" id="backBtn">‹ 返回</button>
<h1 id="topTitle">毛概刷题神器</h1>
<div class="sub" id="topSub">题库全收录 · 期末冲刺 · 记录自动保存在本机浏览器</div>
</div></div>
<div class="wrap">

<!-- SECTION: home -->
<div class="view active" id="view-home">
  <div class="statrow">
    <div class="stat"><b id="stTotal">0</b><span>题库总题数</span></div>
    <div class="stat"><b id="stDone">0</b><span>已练题数</span></div>
    <div class="stat"><b id="stAcc">--</b><span>正确率</span></div>
  </div>
  <div class="modegrid">
    <button class="modebtn hot" id="btnMock"><b>随机模拟</b><span>全库抽50题，考前自测</span></button>
    <button class="modebtn" id="btnWrong"><b>错题本</b><span id="wrongCount">0 道待消灭</span></button>
    <button class="modebtn" id="btnMaterial"><b>材料题背诵</b><span>27 道大题＋参考答案</span></button>
    <button class="modebtn" id="btnSearch"><b>搜题</b><span>关键词速查答案</span></button>
  </div>
  <div class="sect-title">分章节练习（单选＋判断）</div>
  <div class="chlist" id="chList"></div>
  <div class="foot-note">题目与答案均来自老师提供的题库原卷<br>
  <button class="linkbtn" id="btnReset">清空全部刷题记录</button></div>
</div>

<!-- SECTION: quiz -->
<div class="view" id="view-quiz">
  <div class="quizhead">
    <span class="qprog" id="qProg"></span>
    <span class="qacc" id="qAcc"></span>
  </div>
  <div class="qcard">
    <span class="qtype" id="qType"></span><span class="qchap" id="qChap"></span>
    <div class="qstem" id="qStem"></div>
    <div class="opts" id="qOpts"></div>
    <div class="judgebtns" id="qJudge" style="display:none">
      <button class="jbtn t" id="jTrue">√ 正确</button>
      <button class="jbtn f" id="jFalse">× 错误</button>
    </div>
    <div class="feedback" id="qFeed"></div>
    <div class="nextrow" id="qNextRow"><button class="nextbtn" id="qNext">下一题</button></div>
  </div>
</div>

<!-- SECTION: result -->
<div class="view" id="view-result">
  <div class="rescard">
    <div class="big" id="resScore"></div>
    <div class="lbl">本轮正确率</div>
    <div class="resdetail" id="resDetail"></div>
    <div class="resbtns">
      <button class="primary" id="resWrong">重练本轮错题</button>
      <button class="ghost" id="resHome">返回首页</button>
    </div>
  </div>
</div>

<!-- SECTION: wrong -->
<div class="view" id="view-wrong">
  <div class="wrongbar">
    <button class="start" id="wrongStart">开始重练（答对即移出错题本）</button>
    <button class="clear" id="wrongClear">清空</button>
  </div>
  <div id="wrongList"></div>
</div>

<!-- SECTION: material -->
<div class="view" id="view-material">
  <div class="chips" id="matChips"></div>
  <div id="matList"></div>
</div>

<!-- SECTION: search -->
<div class="view" id="view-search">
  <div class="searchbox">
    <input id="searchInput" type="search" placeholder="输入关键词，如：实事求是 / 七大 / 初级阶段">
    <button id="searchGo">搜索</button>
  </div>
  <div class="scount" id="searchCount"></div>
  <div id="searchList"></div>
</div>

</div>

    "type": "material",
    "stem": "结合材料，回答问题：                                                材料1\n毛泽东思想的活的灵魂，是贯穿于上述各个组成部分的立场、观点和方法，它们有三个基本方面，即实事求是，群众路线，独立自主。毛泽东同志把辩证唯物主义和历史唯物主义运用于无产阶级政党的全部工作，在中国革命的长期艰苦斗争中形成了具有中国共产党人特色的这些立场、观点和方法，丰富和发展了马克思列宁主义。它们不仅表现在《反对本本主义》《实践论》《矛盾论》《〈农村调查〉的序言和跋》《关于领导方法的若干问题》《人的正确思想是从那里来的？》等重要著作中，而且表现在毛泽东同志的全部科学著作中，表现在中国共产党人的革命活动中。\n--摘自《关于建国以来党的若干历史问题的决议》\n材料2\n马克思、恩格斯没有直接用过\"实事求是\"这个词汇，但他们创立的辩证唯物主义和历史唯物主义，突出强调的就是实事求是。实事求是，是毛泽东同志用中国成语对辩证唯物主义和历史唯物主义世界观和方法论所作的高度概括。坚持实事求是，就是坚持一切从实际出发来研究和解决问题，坚持理论联系实际来制定和形成指导实践发展的正确路线方针政策，坚持在实践中检验真理和发展真理。\n--摘自习近平同志2012年5月16日在中央党校春季学期第二批入学学员开学典礼上的讲话\n材料3\n党在斗争实践中认识到，革命斗争是人民群众的斗争，必须紧紧依靠和充分组织动员人民群众。毛泽东提出并系统阐发了\"从群众中来，到群众中去\"的根本方法。在《关于领导方法的若干问题》中，毛泽东指出：\"在我党的一切实际工作中，凡属正确的领导，必须是从群众中来，到群众中去。这就是说，将群众的意见（分散的无系统的意见）集中起来（经过研究，化为集中的系统的意见），又到群众中去作宣传解释，化为群众的意见，使群众坚持下去，见之于行动，并在群众行动中考验这些意见是否正确。然后再从群众中集中起来，再到群众中坚持下去。如此无限循环，一次比一次地更正确、更生动、更丰富。这就是马克思主义的认识论。\"\n--摘自《光明日报》，2023年1月30日\n材料4\n1935年1月，中央政治局在长征途中举行的遵义会议，\"开启了党独立自主解决中国革命实际问题新阶段\"\"在最危急关头挽救了党、挽救了红军、挽救了中国革命\"\"这在党的历史上是一个生死攸关的转折点\"。为什么遵义会议在党的历史上具有这样重要的意义呢？这是因为我们党的独立自主是从这个时候开始的。1963年9月，毛泽东会见外宾时讲到这件事，指出：\"离开了先生，学生就自己学。有先生有好处，也有坏处。不要先生，自己读书，自己写字，自己想问题。这是一条真理。过去我们就是由先生把着手学写字，从一九二一年党成立到一九三四年，我们就是吃了先生的亏，纲领由先生起草，中央全会的决议也由先生起草，特别是一九三四年，使我们遭到了很大的损失。从那之后，我们就懂得要自己想问题。我们认识中国，花了几十年时间。中国人不懂中国情况，这怎么行？真正懂得独立自主是从遵义会议开始的，这次会议批判了教条主义。\"\n--摘自《中共党史研究》，2023年3月13日\n结合上述材料，谈谈如何理解毛泽东思想活的灵魂。",
    "answer": "实事求是是毛泽东思想的基本点，是毛泽东思想的精髓。实事求是，就是一切从实际出发，理论联系实际，坚持在实践中检验真理和发展真理。这是中国共产党的思想路线。实事求是，是马克思主义的根本观点，是中国共产党人认识世界、改造世界的根本要求，是我们党的基本思想方法、工作方法、领导方法。不论过去、现在和将来，我们都要坚持一切从实际出发，理论联系实际，在实践中检验真理和发展真理。\n群众路线，就是一切为了群众，一切依靠群众，从群众中来，到群众中去，把党的正确主张变为群众的自觉行动。群众路线是以毛泽东同志为主要代表的中国共产党人坚持把马克思列宁主义关于人民群众是历史创造者的原理，系统地运用在党的全部活动中形成的党的根本工作路线。不论过去、现在和将来，群众路线都是我们党的生命线和根本工作路线，是我们党永葆青春活力和战斗力的重要传家宝。群众路线本质上体现的是马克思主义关于人民群众是历史的创造者这一基本原理。只有坚持这一基本原理，我们才能把握历史前进的基本规律。只有按历史规律办事，我们才能无往而不胜。\n独立自主，就是坚持独立思考，走自己的路，就是坚定不移地维护民族独立、捍卫国家主权，把立足点放在依靠自己力量的基础上，同时积极争取外援，开展国际经济文化交流，学习外国一切对我们有益的先进事物。独立自主是中华民族的优良传统，是中国共产党、中华人民共和国立党立国的重要原则，是我们党从中国实际出发、依靠党和人民力量进行革命、建设、改革的必然结论。不论过去、现在和将来，我们都要把国家和民族的发展放在自己力量的基点上，增强民族自尊心和自信心，坚定不移走自己的路。\n新时代坚持和发展毛泽东思想，就要认真学习和运用贯穿其中的立场、观点和方法，研究实践中出现的新情况，解决新问题。习近平总书记在纪念毛泽东同志诞辰120周年座谈会上的讲话中强调：“新形势下，我们要坚持和运用好毛泽东思想活的灵魂，把我们党建设好，把中国特色社会主义伟大事业继续推向前进。”",

    "stem": "结合材料，回答问题：\n材料1\n1957年2月，毛泽东在最高国务会议上作《如何处理人民内部的矛盾》（后改为《关于正确处理人民内部矛盾的问题》）的报告。《关于正确处理人民内部矛盾的问题》在马克思主义发展史上具有开创性意义。毛泽东深入研究社会主义社会的矛盾问题，形成了一套系统的关于社会主义社会矛盾的学说，丰富和发展了科学社会主义理论，对党和社会主义建设事业具有长远的指导意义。                                                      材料2                                                                 社会主义制度下还存不存在矛盾，是斯大林领导苏联社会主义建设实践中长期被回避的问题。以毛泽东为代表的中国共产党人，从延安整风开始，就已经注意到社会矛盾的不同性质并加以分析。新中国成立之初，刘少奇、李立三从分析国营工厂的内部矛盾入手，对社会存在的敌对矛盾和非敌对矛盾的问题进行了论述。1955年，毛泽东提出要分清楚\"人民的内部和外部两个不同的范畴\"。这些论述成为社会主义两类矛盾学说的思想来源。                       --摘自中共中央党史研究室第二研究部编著：《〈中国共产党历史〉第二卷注释集》，中共党史出版社2012年版                                                                                         请回答：\n（1）为什么《关于正确处理人民内部矛盾的问题》在马克思主义发展史上具有开创性意义？\n（2）关于社会主义社会矛盾学说的一个重要方面，是关于社会主义社会存在两类不同性质矛盾的理论，如何理解这两类不同性质的矛盾？\n（3）如何处理这两类不同性质的矛盾？",

    "answer": "（1）中国特色社会主义发展的历史逻辑：中华文明作为世界各大古老文明中唯一没有中断过的文明，是中华民族生生不息、发展壮大的重要滋养。然而近代以来，逐步沦落为半殖民地半封建社会。无论是太平天国起义、洋务运动、维新变法、辛亥革命等等，均以失败告终。十月革命一声炮响，给中国送来了马克思列宁主义。从此，进步的中国知识分子把社会主义和共产主义鲜明地写在自己的旗帜上。从上海的石库门、南湖的红船、井冈山的星火、遵义的抉择、长征的艰难曲折、延河的潺潺流水，到天安门的华灯闪烁，中国共产党领导人民经过28年浴血奋战，完成了新民主主义革命的历史任务，建立了中华人民共和国，为建立社会主义制度创造了历史前提。\n新中国成立后的社会主义革命，实现了中国历史上最深刻的社会变革。虽然在之后的社会主义建设探索中出现了曲折，但我们成功建立了独立的比较完整的工业体系和国民经济体系，为社会主义制度奠定了牢固的物质技术基础和经济支撑，为社会主义建设积累了宝贵经验。党的十一届三中全会开启了改革开放的伟大历史进程，特别是党的十八大以来，以习近平同志为核心的党中央团结带领全党全国各族人民，毫不动摇坚持和发展中国特色社会主义，创立了习近平新时代中国特色社会主义思想，以党和国家事业的历史性成就、历史性变革推动中国特色社会主义进入新时代。\n中国特色社会主义发展的理论逻辑：1848年2月《共产党宣言》出版，宣告科学社会主义诞生。马克思和恩格斯明确指出实现资本主义向更高的社会形态发展，必须在资本主义充分发展的基础上进行无产阶级革命，并设想无产阶级革命在资本主义世界一切文明国家至少在几个主要资本主义国家同时发生并取得胜利。在帝国主义和无产阶级革命阶段，列宁用马克思主义基本立场、观点和方法分析帝国主义特征和俄国社会与俄国革命，创造性地把马克思主义与俄国实际相结合，创立了列宁主义，以此为指导成功取得十月革命的胜利，进而建立起世界上第一个社会主义国家，实现了科学社会主义由理论到实践的历史性飞跃。在半殖民地半封建的中国能否进行无产阶级革命，能否实现社会主义？这在马克思主义的文本里找不到现成答案。以毛泽东同志为主要代表的中国共产党人深入研究中国社会和中国革命实际，以高度的理论自觉和理论勇气，创造性地把马克思主义与中国实际相结合，开创了以农村包围城市、武装夺取政权的中国革命道路，形成新民主主义理论，创立了毛泽东思想，以此为指导取得新民主主义革命的胜利，在此基础上建立起社会主义制度，开展了建设社会主义的探索，为中国特色社会主义提供了基础和前提。\n在和平与发展成为时代主题的新历史条件下，在世界上最大的发展中国家如何建设社会主义，同样是一个前无古人的历史课题。以邓小平同志为主要代表的中国共产党人，总结新中国成立以来正反两方面的经验，逐步形成了建设中国特色社会主义的路线、方针、政策，阐明了在中国建设社会主义、巩固和发展社会主义的基本问题，创立了邓小平理论。以江泽民同志为主要代表的中国共产党人，加深了对什么是社会主义、怎样建设社会主义和建设什么样的党、怎样建设党的认识，积累了治党治国新的宝贵经验，形成了“三个代表”重要思想。以胡锦涛同志为主要代表的中国共产党人，深刻认识和回答了新形势下实现什么样的发展、怎样发展等重大问题，形成了以人为本、全面协调可持续发展的科学发展观。\n新时代提出新课题，新课题催生新理论，新理论引领新实践。新时代，以习近平同志为核心的党中央基于对党的执政规律、社会主义建设规律和人类社会发展规律的深刻把握，提出一系列新理念新思想新战略，形成习近平新时代中国特色社会主义思想，有力回应了新时代的重大课题，深刻揭示了新时代中国特色社会主义的本质特征、发展规律和建设路径，是马克思主义中国化时代化最新成果，是当代中国马克思主义、21世纪马克思主义，是党和国家必须长期坚持的指导思想。\n中国特色社会主义发展的实践逻辑：社会主义500年，经历了空想社会主义产生和发展，马克思、恩格斯创立科学社会主义理论体系，列宁领导十月革命胜利并实践社会主义，苏联模式逐步形成，新中国成立后我们党对社会主义的探索和实践，我们党作出进行改革开放的历史性决策、开创和发展中国特色社会主义等阶段。纵观历史可知，我们党在推进革命、建设、改革进程中，是怎样经过反复比较和总结，历史地选择马克思主义、选择社会主义道路的；是怎样把马克思主义基本原理同中国实际和时代特征结合起来，独立自主走自己的路的；是怎样历经千辛万苦、付出各种代价，开创和发展中国特色社会主义的。经过长期努力，进入新时代的中国特色社会主义，使近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景；使科学社会主义在21世纪的中国焕发出强大生机活力，正成为21世纪科学社会主义发展的旗帜，成为振兴世界社会主义的中流砥柱。\n反观苏联东欧等原社会主义国家放弃社会主义道路所造成的国家解体、经济衰落、民生凋敝，以及受西方推动的“颜色革命”影响正在遭受战乱荼毒的西亚北非一些国家，就会愈加发现，中国特色社会主义的成功经验无疑将为世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供可资借鉴和选择的新路径、新方案。\n（2）大会的主题，是大会精神的集中体现，是大会报告的灵魂和主旨。领会好大会主题的丰富内涵，对于全面准确领会大会精神特别是报告的精神非常有帮助。中国特色社会主义是改革开放以来党的全部理论和实践的主题。改革开放以来，党的代表大会的主题随着时代发展侧重点有所变化，但历次党代会的主题都是围绕着“中国特色社会主义”展开而且不断深化。旗帜鲜明地向党内外、国内外宣示，党在新的征程上举什么旗、走什么路、以什么样的精神状态、朝着什么样的目标继续前进。随着中国特色社会主义伟大实践的不断推进和深入，中国特色社会主义的理论创新也在不断前进和发展。\n关于“高举中国特色社会主义伟大旗帜，全面贯彻新时代中国特色社会主义思想”。这强调的是“旗帜”和“思想”问题。旗帜就是方向，思想就是行动指南。开宗明义亮明党的政治方向和指导思想，是要郑重宣示，在新时代新征程上全党必须坚持以马克思主义中国化时代化最新成果为指导，坚定中国特色社会主义道路自信、理论自信、制度自信、文化自信，坚持道不变、志不改，确保党和国家事业始终沿着正确方向胜利前进。",

    "id": "第八章-96"
   },
   {
    "type": "material",
    "stem": "结合材料，回答问题；\n材料1\n科学发展观基本要求是全面协调可持续。科学发展观所倡导的发展，之所以是科学的，就在于它是全面协调可持续的发展，即又好又快的发展，而不是片面的发展、不计代价的发展、竭泽而渔式的发展。\n--摘自党的十七大报告\n材料2\n实现可持续发展，核心的问题是实现经济社会和人口资源环境的协调发展。现在国际上形成了一个越来越明确的共识，就是发展不仅要看经济增长指标，还要看人文指标、资源指标、环境指标。\n--摘自江泽民《在中央人口资源环境工作座谈会上的讲话》(2002年3月10日）\n材料3\n1999年至2008年，中国累计实施退耕还林4.03亿亩，相当于再造了一个东北、内蒙古国有林区。国家林业局副局长李育材介绍，中国累计实施的4.03亿亩退耕还林面积中，退耕地造林1.39亿亩，荒山荒地造林2.37亿亩，封山育林0.27亿亩，工程范围涉及25个省（区、市）和新疆生产建设兵团的3200万农户、1.24亿农民。\n根据现有退耕还林政策，截至2008年底已累计投入1918亿元。由此，退耕还林工程成为中国乃至世界上投资最大、政策性最强、涉及面最广、群众参与程度最高的一项重大生态工程。\n--摘自新华社报道（2009年9月9日）\n(1)根据材料1和材料2，概括全面协调可持续的含义。\n(2)根据以上三则材料，谈谈你如何理解全面协调可持续是科学发展观的基本要求？如何坚持全面协调可持续发展？",
    "answer": "（1）全面协调可持续中的“全面”是指发展要有全面性、整体性，不仅经济发展，而且各个方面都要发展；“协调”是指发展要有协调性、均衡性，各个方面、各个环节的发展要相互适应、相互促进；“可持续”是指发展要有持久性、连续性，不仅当前要发展，而且要保证长远发展。\n（2）全面协调可持续是科学发展观的基本要求。胡锦涛指出，我们之所以把全面协调可持续作为科学发展观的基本要求来强调，这是因为：一方面，经过长期发展，我们积累了较为雄厚的物质技术条件，可以在推进全面协调可持续发展上有更大作为；另一方面，城乡区域发展不平衡、经济社会发展不协调、经济发展与人口资源环境不适应等问题更加突出地摆在了我们面前。只有更加自觉地推进全面协调可持续发展，才能更好化解我国发展的各种制约因素，更好推动我国发展进程，确保实现我国发展的战略目标。\n坚持全面发展，就是要按照中国特色社会主义事业总体布局，正确认识和把握经济建设、政治建设、文化建设、社会建设、生态文明建设是相互联系、相互促进的有机统一体。坚持协调发展，就是保证中国特色社会主义各个领域协调推进。坚持可持续发展，坚定走生产发展、生活富裕、生态良好的文明发展道路。坚持可持续发展，还必须建设生态文明。",
    "id": "第八章-97"
   }
  ]
 }
]</script>
<script>
/* SECTION: data */
const CHAPTERS = JSON.parse(document.getElementById('bankData').textContent);
const ALL = [];
CHAPTERS.forEach(c => c.questions.forEach(q => { q.chapter = c.name; q.topic = c.topic; ALL.push(q); }));
const OBJ = ALL.filter(q => q.type !== 'material');
const MATS = ALL.filter(q => q.type === 'material');
const byId = {}; ALL.forEach(q => byId[q.id] = q);

/* SECTION: store */
const KEY = 'maogai_v1';
let store = { done: {}, wrong: {}, mat: {} };
try { const s = localStorage.getItem(KEY); if (s) store = Object.assign(store, JSON.parse(s)); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

/* SECTION: helpers */
const $ = id => document.getElementById(id);
function el(tag, cls, text){ const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
function shuffle(a){ const r = a.slice(); for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function ansText(q){
  if (q.type === 'single'){ const o = q.options.find(o => o.k === q.answer); return q.answer + '. ' + (o ? o.v : ''); }
  if (q.type === 'judge') return q.answer ? '√ 正确' : '× 错误';
  return q.answer;
}
function typeName(q){ return q.type === 'single' ? '单选题' : q.type === 'judge' ? '判断题' : '材料分析题'; }

/* SECTION: nav */
let curView = 'home';
const titles = { home:'毛概刷题神器', quiz:'刷题中', result:'本轮成绩', wrong:'错题本', material:'材料题背诵', search:'搜题' };
function show(v){
  curView = v;
  document.querySelectorAll('.view').forEach(n => n.classList.remove('active'));
  $('view-' + v).classList.add('active');
  $('backBtn').classList.toggle('show', v !== 'home');
  $('topTitle').textContent = titles[v] || '毛概刷题神器';
  window.scrollTo(0, 0);
  if (v === 'home') renderHome();
}
$('backBtn').addEventListener('click', () => show('home'));

/* SECTION: home render */
function renderHome(){
  $('stTotal').textContent = ALL.length;
  const ids = Object.keys(store.done);
  $('stDone').textContent = ids.length;
  let ok = 0; ids.forEach(id => { if (store.done[id]) ok++; });
  $('stAcc').textContent = ids.length ? Math.round(ok / ids.length * 100) + '%' : '--';
  $('wrongCount').textContent = Object.keys(store.wrong).length + ' 道待消灭';
  const list = $('chList'); list.textContent = '';
  CHAPTERS.forEach(c => {
    const qs = c.questions.filter(q => q.type !== 'material');
    const mats = c.questions.filter(q => q.type === 'material');
    let done = 0; qs.forEach(q => { if (q.id in store.done) done++; });
    const card = el('div', 'chcard');
    const head = el('div', 'chhead');
    head.appendChild(el('span', 'chname', c.name));
    head.appendChild(el('span', 'chtopic', c.topic));
    card.appendChild(head);
    card.appendChild(el('div', 'chmeta', '单选 ' + qs.filter(q=>q.type==='single').length + ' · 判断 ' + qs.filter(q=>q.type==='judge').length + ' · 材料 ' + mats.length + ' ｜ 已练 ' + done + '/' + qs.length));
    const pb = el('div', 'pbar'); const pi = el('i'); pi.style.width = (qs.length ? done / qs.length * 100 : 0) + '%'; pb.appendChild(pi); card.appendChild(pb);
    const btns = el('div', 'chbtns');
    const b1 = el('button', 'fill', '顺序练习');
    b1.addEventListener('click', () => startQuiz(qs, c.name + ' · 顺序练习', false));
    const b2 = el('button', '', '随机练习');
    b2.addEventListener('click', () => startQuiz(qs, c.name + ' · 随机练习', true));
    const b3 = el('button', '', '只练未做');
    b3.addEventListener('click', () => {
      const todo = qs.filter(q => !(q.id in store.done));
      if (!todo.length){ alert('本章已全部练过，可选随机练习巩固'); return; }
      startQuiz(todo, c.name + ' · 未做题', false);
    });
    btns.appendChild(b1); btns.appendChild(b2); btns.appendChild(b3);
    card.appendChild(btns);
    list.appendChild(card);
  });
}
$('btnMock').addEventListener('click', () => {
  const s = shuffle(OBJ.filter(q => q.type === 'single')).slice(0, 25);
  const j = shuffle(OBJ.filter(q => q.type === 'judge')).slice(0, 25);
  startQuiz(shuffle(s.concat(j)), '随机模拟 · 50题', false);
});
$('btnWrong').addEventListener('click', () => { renderWrong(); show('wrong'); });
$('btnMaterial').addEventListener('click', () => { renderMatChips(); renderMats('全部'); show('material'); });
$('btnSearch').addEventListener('click', () => { show('search'); $('searchInput').focus(); });
$('btnReset').addEventListener('click', () => {
  if (confirm('确定清空全部刷题记录、错题本和背诵标记吗？此操作不可恢复。')){
    store = { done: {}, wrong: {}, mat: {} }; save(); renderHome();
  }
});

/* SECTION: quiz engine */
let session = null;
function startQuiz(questions, label, rand){
  if (!questions.length){ alert('没有可练的题目'); return; }
  session = { qs: rand ? shuffle(questions) : questions.slice(), i: 0, ok: 0, wrongIds: [], label: label, answered: false };
  show('quiz');
  $('topSub').textContent = label;
  renderQuestion();
}
function renderQuestion(){
  const s = session; const q = s.qs[s.i]; s.answered = false;
  $('qProg').textContent = '第 ' + (s.i + 1) + ' / ' + s.qs.length + ' 题';
  $('qAcc').textContent = s.i ? '本轮答对 ' + s.ok + '/' + s.i : '';
  const t = $('qType'); t.textContent = typeName(q); t.className = 'qtype' + (q.type === 'judge' ? ' judge' : '');
  $('qChap').textContent = q.chapter;
  $('qStem').textContent = q.stem;
  $('qFeed').className = 'feedback'; $('qFeed').textContent = '';
  $('qNextRow').className = 'nextrow';
  const opts = $('qOpts'); opts.textContent = '';
  const jb = $('qJudge');
  if (q.type === 'single'){
    jb.style.display = 'none'; opts.style.display = 'flex';
    q.options.forEach(o => {
      const b = el('button', 'opt');
      b.appendChild(el('span', 'k', o.k));
      b.appendChild(el('span', 'v', o.v));
      b.dataset.k = o.k;
      b.addEventListener('click', () => answerSingle(q, o.k));
      opts.appendChild(b);
    });
  } else {
    opts.style.display = 'none'; jb.style.display = 'grid';
    ['jTrue','jFalse'].forEach(id => { const b = $(id); b.disabled = false; b.className = 'jbtn ' + (id === 'jTrue' ? 't' : 'f'); });
  }
}
function finishAnswer(q, correct, extra){
  const s = session; s.answered = true;
  store.done[q.id] = correct;
  if (correct){ s.ok++; delete store.wrong[q.id]; }
  else { store.wrong[q.id] = true; if (!s.wrongIds.includes(q.id)) s.wrongIds.push(q.id); }
  save();
  const f = $('qFeed');
  f.className = 'feedback show ' + (correct ? 'ok' : 'no');
  f.textContent = '';
  f.appendChild(el('b', '', correct ? '✓ 回答正确' : '✗ 回答错误'));
  if (!correct || q.type === 'judge'){
    f.appendChild(el('div', '', '正确答案：' + ansText(q) + (extra || '')));
  }
  if (!correct) f.appendChild(el('div', '', '已自动加入错题本'));
  $('qNextRow').className = 'nextrow show';
  $('qNext').textContent = s.i + 1 >= s.qs.length ? '查看本轮成绩' : '下一题';
  $('qAcc').textContent = '本轮答对 ' + s.ok + '/' + (s.i + 1);
}
function answerSingle(q, k){
  if (session.answered) return;
  const correct = k === q.answer;
  document.querySelectorAll('#qOpts .opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.k === q.answer) b.classList.add('correct');
    else if (b.dataset.k === k) b.classList.add('wrongpick');
    else b.classList.add('dim');
  });
  finishAnswer(q, correct);
}
function answerJudge(q, val){
  if (session.answered) return;
  const correct = val === q.answer;
  const pick = val ? $('jTrue') : $('jFalse');
  const right = q.answer ? $('jTrue') : $('jFalse');
  right.classList.add('correct');
  if (!correct) pick.classList.add('wrongpick');
  (val ? $('jFalse') : $('jTrue')).classList.add('dim');
  $('jTrue').disabled = true; $('jFalse').disabled = true;
  finishAnswer(q, correct);
}
$('jTrue').addEventListener('click', () => answerJudge(session.qs[session.i], true));
$('jFalse').addEventListener('click', () => answerJudge(session.qs[session.i], false));
$('qNext').addEventListener('click', () => {
  const s = session;
  if (s.i + 1 >= s.qs.length){ renderResult(); show('result'); return; }
  s.i++; renderQuestion(); window.scrollTo(0, 0);
});
function renderResult(){
  const s = session; const n = s.qs.length;
  $('resScore').textContent = Math.round(s.ok / n * 100) + '%';
  $('resDetail').textContent = '共 ' + n + ' 题，答对 ' + s.ok + ' 题，答错 ' + (n - s.ok) + ' 题。' + (s.wrongIds.length ? '错题已存入错题本。' : '全对，太稳了！');
  $('resWrong').style.display = s.wrongIds.length ? 'block' : 'none';
}
$('resWrong').addEventListener('click', () => {
  const qs = session.wrongIds.map(id => byId[id]).filter(Boolean);
  startQuiz(qs, '本轮错题重练', true);
});
$('resHome').addEventListener('click', () => { $('topSub').textContent = '题库全收录 · 期末冲刺 · 记录自动保存在本机浏览器'; show('home'); });

/* SECTION: wrong book */
function renderWrong(){
  const ids = Object.keys(store.wrong).filter(id => byId[id]);
  const list = $('wrongList'); list.textContent = '';
  $('wrongStart').disabled = !ids.length;
  $('wrongStart').style.opacity = ids.length ? 1 : .5;
  if (!ids.length){ list.appendChild(el('div', 'empty', '错题本是空的，保持住！')); return; }
  ids.forEach(id => {
    const q = byId[id];
    const item = el('div', 'witem');
    item.appendChild(el('span', 'qtype' + (q.type === 'judge' ? ' judge' : ''), typeName(q)));
    item.appendChild(el('span', 'qchap', q.chapter));
    item.appendChild(el('div', 'wstem', q.stem));
    item.appendChild(el('div', 'wans', '正确答案：' + ansText(q)));
    list.appendChild(item);
  });
}
$('wrongStart').addEventListener('click', () => {
  const qs = Object.keys(store.wrong).map(id => byId[id]).filter(Boolean);
  if (!qs.length) return;
  startQuiz(qs, '错题重练 · ' + qs.length + '题', true);
});
$('wrongClear').addEventListener('click', () => {
  if (confirm('确定清空错题本吗？')){ store.wrong = {}; save(); renderWrong(); }
});

/* SECTION: material */
let matCh = '全部';
function renderMatChips(){
  const box = $('matChips'); box.textContent = '';
  const names = ['全部'].concat(CHAPTERS.filter(c => c.questions.some(q => q.type === 'material')).map(c => c.name));
  names.forEach(n => {
    const b = el('button', 'chip' + (n === matCh ? ' on' : ''), n);
    b.addEventListener('click', () => { matCh = n; renderMatChips(); renderMats(n); });
    box.appendChild(b);
  });
}
function renderMats(ch){
  const list = $('matList'); list.textContent = '';
  const ms = MATS.filter(q => ch === '全部' || q.chapter === ch);
  ms.forEach((q, idx) => {
    const card = el('div', 'mcard');
    card.appendChild(el('span', 'mtag', q.chapter + ' · 材料题 ' + (idx + 1)));
    card.appendChild(el('div', 'mstem', q.stem));
    if (q.answer_supplemented) card.appendChild(el('span', 'supp', '原卷未附答案，以下为补充整理的参考答案'));
    const ans = el('div', 'mans', q.answer);
    card.appendChild(ans);
    const btns = el('div', 'mbtns');
    const rev = el('button', 'reveal', '显示答案');
    rev.addEventListener('click', () => {
      const on = ans.classList.toggle('show');
      rev.textContent = on ? '收起答案' : '显示答案';
    });
    const got = el('button', 'got' + (store.mat[q.id] === 1 ? ' on' : ''), '已背会');
    const notyet = el('button', 'notyet' + (store.mat[q.id] === 0 ? ' on' : ''), '还没熟');
    got.addEventListener('click', () => { store.mat[q.id] = 1; save(); got.classList.add('on'); notyet.classList.remove('on'); });
    notyet.addEventListener('click', () => { store.mat[q.id] = 0; save(); notyet.classList.add('on'); got.classList.remove('on'); });
    btns.appendChild(rev); btns.appendChild(got); btns.appendChild(notyet);
    card.appendChild(btns);
    list.appendChild(card);
  });
}

/* SECTION: search */
function doSearch(){
  const kw = $('searchInput').value.trim();
  const list = $('searchList'); list.textContent = '';
  if (!kw){ $('searchCount').textContent = ''; return; }
  const hits = ALL.filter(q => {
    if (q.stem.includes(kw) || (q.answer && q.answer.includes(kw))) return true;
    if (q.options) return q.options.some(o => o.v.includes(kw));
    return false;
  });
  $('searchCount').textContent = '找到 ' + hits.length + ' 条相关题目' + (hits.length > 60 ? '（仅显示前 60 条）' : '');
  hits.slice(0, 60).forEach(q => {
    const item = el('div', 'sitem');
    item.appendChild(el('span', 'qtype' + (q.type === 'judge' ? ' judge' : ''), typeName(q)));
    item.appendChild(el('span', 'qchap', q.chapter));
    item.appendChild(el('div', 'sstem', q.type === 'material' ? q.stem.slice(0, 160) + '……' : q.stem));
    item.appendChild(el('div', 'sans', '答案：' + ansText(q)));
    list.appendChild(item);
  });
  if (!hits.length) list.appendChild(el('div', 'empty', '没有找到相关题目，换个关键词试试'));
}
$('searchGo').addEventListener('click', doSearch);
$('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

/* SECTION: init */
renderHome();
</script>
</body>
</html>
